upstream django {
    server django:8000;
}

# El tramo Traefik -> nginx es HTTP, así que $scheme siempre vale "http" y
# Django terminaba generando URLs absolutas con http:// aunque el cliente
# hubiera entrado por HTTPS. Se reenvía el valor que puso Traefik, y solo se
# cae a $scheme cuando la cabecera no viene (acceso directo, health checks).
map $http_x_forwarded_proto $esquema_original {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    client_max_body_size 50M;

    # Servir media directamente desde el volumen (fotos, uploads)
    location /media/ {
        alias /app/media/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Todo lo demás va a Django
    location / {
        proxy_pass http://django;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $esquema_original;
    }
}
