networks:
  traefik_public:
    external: true

volumes:
  pgdata:
    driver: local
  media_data:
    driver: local

services:
  django:
    build:
      context: ./ab_reservas_project
      dockerfile: Dockerfile
    container_name: ab-django
    restart: unless-stopped
    networks:
      - traefik_public
    env_file:
      - ./ab_reservas_project/.env.prod
    volumes:
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy

  # Servicio MCP — asiste la confirmación de pre-reservas.
  # Misma imagen que Django; usa la ORM directamente, sin migraciones propias.
  # entrypoint.sh siempre levanta uvicorn, por eso se sobreescribe.
  #
  # NO publica puertos al host: solo es alcanzable por Traefik dentro de la red
  # traefik_public. Requiere MCP_JWT_PUBLIC_KEY en .env.prod o no arranca.
  mcp:
    build:
      context: ./ab_reservas_project
      dockerfile: Dockerfile
    container_name: ab-mcp
    restart: unless-stopped
    networks:
      - traefik_public
    env_file:
      - ./ab_reservas_project/.env.prod
    environment:
      MCP_TRANSPORT: http
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8001"
      # Dónde vive este resource server y quién emite sus tokens.
      # OAUTH_ISSUER apunta al Django que corre django-oauth-toolkit.
      MCP_PUBLIC_URL: https://mcp.alejandrobenitez.com
      OAUTH_ISSUER: https://admin.alejandrobenitez.com
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["python", "-m", "mcp_server"]
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_public"
      - "traefik.http.services.mcp.loadbalancer.server.port=8001"

      - "traefik.http.routers.mcp.rule=Host(`mcp.alejandrobenitez.com`)"
      - "traefik.http.routers.mcp.entrypoints=websecure"
      - "traefik.http.routers.mcp.tls=true"
      - "traefik.http.routers.mcp.tls.certresolver=le"
      - "traefik.http.routers.mcp.service=mcp"
      - "traefik.http.routers.mcp.middlewares=mcp-headers"

      # Cabeceras de seguridad. La autenticación real es el JWT que valida
      # FastMCP; esto solo endurece el borde.
      - "traefik.http.middlewares.mcp-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.mcp-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.mcp-headers.headers.frameDeny=true"
      - "traefik.http.middlewares.mcp-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.mcp-headers.headers.referrerPolicy=no-referrer"

  nginx:
    image: nginx:alpine
    container_name: ab-nginx
    restart: unless-stopped
    networks:
      - traefik_public
    volumes:
      - ./nginx/nginx.backend.conf:/etc/nginx/conf.d/default.conf:ro
      - media_data:/app/media:ro
    depends_on:
      - django
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_public"
      - "traefik.http.services.django.loadbalancer.server.port=80"

      # Middleware: redirect raíz → /fractalia/calendario/
      - "traefik.http.middlewares.fractalia-root-redirect.redirectregex.regex=^https://fractalia\\.alejandrobenitez\\.com/?$$"
      - "traefik.http.middlewares.fractalia-root-redirect.redirectregex.replacement=https://fractalia.alejandrobenitez.com/fractalia/calendario/"
      - "traefik.http.middlewares.fractalia-root-redirect.redirectregex.permanent=true"
      # Middleware: redirect raíz → /admin/
      - "traefik.http.middlewares.admin-root-redirect.redirectregex.regex=^https://admin\\.alejandrobenitez\\.com/?$$"
      - "traefik.http.middlewares.admin-root-redirect.redirectregex.replacement=https://admin.alejandrobenitez.com/admin/"
      - "traefik.http.middlewares.admin-root-redirect.redirectregex.permanent=true"

      # Router: links.alejandrobenitez.com
      - "traefik.http.routers.django-links.rule=Host(`links.alejandrobenitez.com`)"
      - "traefik.http.routers.django-links.entrypoints=websecure"
      - "traefik.http.routers.django-links.tls=true"
      - "traefik.http.routers.django-links.tls.certresolver=le"
      - "traefik.http.routers.django-links.service=django"

      # Router: fractalia.alejandrobenitez.com
      - "traefik.http.routers.django-fractalia.rule=Host(`fractalia.alejandrobenitez.com`)"
      - "traefik.http.routers.django-fractalia.entrypoints=websecure"
      - "traefik.http.routers.django-fractalia.tls=true"
      - "traefik.http.routers.django-fractalia.tls.certresolver=le"
      - "traefik.http.routers.django-fractalia.service=django"
      - "traefik.http.routers.django-fractalia.middlewares=fractalia-root-redirect"

      # Router: admin.alejandrobenitez.com
      - "traefik.http.routers.django-admin.rule=Host(`admin.alejandrobenitez.com`)"
      - "traefik.http.routers.django-admin.entrypoints=websecure"
      - "traefik.http.routers.django-admin.tls=true"
      - "traefik.http.routers.django-admin.tls.certresolver=le"
      - "traefik.http.routers.django-admin.service=django"
      - "traefik.http.routers.django-admin.middlewares=admin-root-redirect"

  db:
    image: postgres:16-alpine
    container_name: ab-db
    restart: unless-stopped
    networks:
      - traefik_public
    env_file:
      - ./ab_reservas_project/.env.prod
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
